<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MatrixOps — Matrix Operations</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@400;600&display=swap');
    :root {
      --bg:#f8f9fa; --card:#fff; --text:#212529; --muted:#6c757d;
      --border:#dee2e6; --blue:#0066ff; --light-blue:#e8f0ff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; }

    header {
      background:var(--blue); color:#fff; padding:20px 40px;
      display:flex; align-items:baseline; gap:16px;
    }
    header h1 { font-family:'IBM Plex Mono',monospace; font-size:1.5rem; letter-spacing:2px; }
    header p { font-size:0.8rem; opacity:.7; }

    .layout { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 64px); }

    /* SIDEBAR */
    .sidebar { background:var(--card); border-right:1px solid var(--border); padding:24px; }
    .sidebar h3 { font-family:'IBM Plex Mono',monospace; font-size:0.75rem; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
    .dim-row { display:grid; grid-template-columns:1fr 20px 1fr; gap:6px; align-items:center; margin-bottom:16px; }
    .dim-row input {
      background:var(--bg); border:1px solid var(--border); color:var(--text);
      padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-size:1rem;
      text-align:center; outline:none; width:100%;
    }
    .dim-row input:focus { border-color:var(--blue); }
    .dim-label { text-align:center; color:var(--muted); font-size:1.2rem; }
    .gen-btn {
      width:100%; background:var(--blue); color:#fff; border:none;
      padding:10px; font-family:'IBM Plex Mono',monospace; font-size:0.85rem;
      letter-spacing:1px; cursor:pointer; margin-bottom:8px; text-transform:uppercase;
    }
    .gen-btn:hover { background:#0052cc; }
    .gen-btn.secondary { background:transparent; color:var(--blue); border:1px solid var(--blue); }
    .gen-btn.secondary:hover { background:var(--light-blue); }
    .ops-list { margin-top:24px; display:flex; flex-direction:column; gap:6px; }
    .op-btn {
      padding:9px 14px; text-align:left; border:1px solid var(--border);
      background:transparent; font-family:'IBM Plex Mono',monospace; font-size:0.8rem;
      cursor:pointer; color:var(--text); transition:all .15s;
    }
    .op-btn:hover { background:var(--light-blue); border-color:var(--blue); color:var(--blue); }

    /* MAIN */
    .main { padding:24px; }
    .matrices-row { display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:start; margin-bottom:24px; }
    .matrix-block h4 {
      font-family:'IBM Plex Mono',monospace; font-size:0.7rem; letter-spacing:2px;
      text-transform:uppercase; color:var(--muted); margin-bottom:12px;
    }
    .matrix-grid { display:inline-grid; gap:3px; background:var(--border); padding:1px; }
    .matrix-grid input, .matrix-grid .cell {
      width:48px; height:40px;
      background:var(--card); border:none;
      text-align:center; font-family:'IBM Plex Mono',monospace; font-size:0.9rem;
      color:var(--text); outline:none;
    }
    .matrix-grid input:focus { background:var(--light-blue); color:var(--blue); }
    .matrix-grid .cell { display:flex; align-items:center; justify-content:center; }
    .matrix-grid .cell.highlight { background:#e8fff0; color:#1a7a3a; font-weight:600; }

    .arrow-block { display:flex; align-items:center; padding-top:40px; font-size:2rem; color:var(--blue); }

    /* RESULTS PANEL */
    .results-panel {
      background:var(--card); border:1px solid var(--border); padding:20px;
    }
    .results-panel h3 { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
    .result-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .result-chip {
      padding:6px 14px; background:var(--light-blue); color:var(--blue);
      font-family:'IBM Plex Mono',monospace; font-size:0.8rem; border-radius:2px;
    }
    .op-result { margin-top:12px; }
    .op-result h4 { font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--blue); margin-bottom:8px; }
  </style>
</head>
<body>

<header>
  <h1>MATRIXOPS</h1>
  <p>Matrix Arithmetic & Transformation Tool</p>
</header>

<div class="layout">
  <div class="sidebar">
    <h3>Matrix Config</h3>
    <div>
      <label style="font-size:0.75rem;color:var(--muted);display:block;margin-bottom:6px">Rows × Cols</label>
      <div class="dim-row">
        <input type="number" id="rows" value="3" min="1" max="5"/>
        <div class="dim-label">×</div>
        <input type="number" id="cols" value="3" min="1" max="5"/>
      </div>
    </div>
    <button class="gen-btn" onclick="buildMatrix()">Generate Matrix</button>
    <button class="gen-btn secondary" onclick="fillRandom()">Fill Random</button>

    <h3 style="margin-top:24px">Operations</h3>
    <div class="ops-list">
      <button class="op-btn" onclick="transpose()">⟳ Transpose</button>
      <button class="op-btn" onclick="calcDeterminant()">∑ Determinant (3×3)</button>
      <button class="op-btn" onclick="rowSum()">+ Row Sums</button>
      <button class="op-btn" onclick="colSum()">↓ Column Sums</button>
      <button class="op-btn" onclick="diagonal()">╲ Diagonal Sum</button>
      <button class="op-btn" onclick="scalarMul()">× Scalar (×2)</button>
    </div>
  </div>

  <div class="main">
    <div class="matrices-row">
      <div class="matrix-block">
        <h4>Input Matrix A</h4>
        <div class="matrix-grid" id="input-matrix"></div>
      </div>
      <div class="arrow-block" id="arrow-block">→</div>
      <div class="matrix-block" id="output-block" style="display:none">
        <h4 id="output-label">Transposed Matrix</h4>
        <div class="matrix-grid" id="output-matrix"></div>
      </div>
    </div>

    <div class="results-panel" id="results-panel" style="display:none">
      <h3>Results</h3>
      <div id="result-content"></div>
    </div>
  </div>
</div>

<script>
  let rows=3, cols=3, matrix=[];

  function buildMatrix() {
    rows=parseInt(document.getElementById('rows').value)||3;
    cols=parseInt(document.getElementById('cols').value)||3;
    rows=Math.min(Math.max(rows,1),5);
    cols=Math.min(Math.max(cols,1),5);
    matrix=Array.from({length:rows},()=>Array(cols).fill(0));

    const grid=document.getElementById('input-matrix');
    grid.style.gridTemplateColumns=`repeat(${cols},48px)`;
    grid.innerHTML='';
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const inp=document.createElement('input');
      inp.type='number'; inp.value=0;
      inp.oninput=()=>{ matrix[r][c]=parseFloat(inp.value)||0; };
      grid.appendChild(inp);
    }
    document.getElementById('output-block').style.display='none';
    document.getElementById('results-panel').style.display='none';
  }

  function readMatrix() {
    const inputs=document.getElementById('input-matrix').querySelectorAll('input');
    let i=0;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      matrix[r][c]=parseFloat(inputs[i++].value)||0;
    }
  }

  function fillRandom() {
    buildMatrix();
    const inputs=document.getElementById('input-matrix').querySelectorAll('input');
    inputs.forEach((inp,i)=>{
      const v=Math.floor(Math.random()*19)-9;
      inp.value=v;
      matrix[Math.floor(i/cols)][i%cols]=v;
    });
  }

  function renderOutputMatrix(data, label, highlightDiag=false) {
    readMatrix();
    const R=data.length, C=data[0].length;
    const grid=document.getElementById('output-matrix');
    grid.style.gridTemplateColumns=`repeat(${C},48px)`;
    grid.innerHTML='';
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const cell=document.createElement('div');
      cell.className='cell'+(highlightDiag&&r===c?' highlight':'');
      cell.textContent=data[r][c];
      grid.appendChild(cell);
    }
    document.getElementById('output-label').textContent=label;
    document.getElementById('output-block').style.display='block';
  }

  function showResult(html) {
    document.getElementById('results-panel').style.display='block';
    document.getElementById('result-content').innerHTML=html;
  }

  function transpose() {
    readMatrix();
    const T=Array.from({length:cols},(_,c)=>Array.from({length:rows},(_,r)=>matrix[r][c]));
    renderOutputMatrix(T,'Transposed Matrix');
    showResult(`<div class="result-row"><div class="result-chip">Original: ${rows}×${cols}</div><div class="result-chip">Transposed: ${cols}×${rows}</div></div><p style="font-size:0.8rem;color:var(--muted)">Rows and columns are swapped: T[i][j] = A[j][i]</p>`);
  }

  function calcDeterminant() {
    readMatrix();
    if(rows!==3||cols!==3){showResult('<p style="color:red">Determinant only for 3×3 matrix.</p>');return;}
    const m=matrix;
    const det=m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
             -m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
             +m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
    document.getElementById('output-block').style.display='none';
    showResult(`<div class="result-row"><div class="result-chip">det(A) = ${det.toFixed(4)}</div></div><p style="font-size:0.8rem;color:var(--muted)">Cofactor expansion along first row.</p>`);
  }

  function rowSum() {
    readMatrix();
    const sums=matrix.map((row,i)=>({label:`Row ${i+1}`,val:row.reduce((a,b)=>a+b,0)}));
    const chips=sums.map(s=>`<div class="result-chip">${s.label}: ${s.val}</div>`).join('');
    document.getElementById('output-block').style.display='none';
    showResult(`<div class="result-row">${chips}</div>`);
  }

  function colSum() {
    readMatrix();
    const sums=Array.from({length:cols},(_,c)=>matrix.reduce((a,row)=>a+row[c],0));
    const chips=sums.map((v,c)=>`<div class="result-chip">Col ${c+1}: ${v}</div>`).join('');
    document.getElementById('output-block').style.display='none';
    showResult(`<div class="result-row">${chips}</div>`);
  }

  function diagonal() {
    readMatrix();
    const n=Math.min(rows,cols);
    let main=0, anti=0;
    for(let i=0;i<n;i++){main+=matrix[i][i]; anti+=matrix[i][n-1-i];}
    document.getElementById('output-block').style.display='none';
    showResult(`<div class="result-row"><div class="result-chip">Main Diagonal: ${main}</div><div class="result-chip">Anti-Diagonal: ${anti}</div></div>`);
  }

  function scalarMul() {
    readMatrix();
    const S=matrix.map(row=>row.map(v=>v*2));
    renderOutputMatrix(S,'Scalar × 2');
    showResult(`<div class="result-row"><div class="result-chip">Scalar k = 2</div></div><p style="font-size:0.8rem;color:var(--muted)">Every element multiplied by k.</p>`);
  }

  buildMatrix();
</script>
</body>
</html>
